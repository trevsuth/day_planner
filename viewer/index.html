<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; object-src 'none'; base-uri 'none'">
    <title>Markdown &amp; Mermaid Viewer</title>
  </head>
  <body>
    <main class="app-shell">
      <nav class="app-tabs" aria-label="Application views">
        <a href="/"><span data-icon="planner" aria-hidden="true"></span>Planner</a>
        <a href="/?view=projects"><span data-icon="projects" aria-hidden="true"></span>Projects</a>
        <a href="/graph/"><span data-icon="graph" aria-hidden="true"></span>Graph</a>
        <a href="/viewer/" aria-current="page"><span data-icon="viewer" aria-hidden="true"></span>Viewer</a>
        <a href="/?view=validation"><span data-icon="validation" aria-hidden="true"></span>Validation</a>
        <a href="/?view=search"><span data-icon="search" aria-hidden="true"></span>Search</a>
        <a href="/?view=api"><span data-icon="api" aria-hidden="true"></span>API</a>
        <a class="shortcut-help-button" href="/?shortcuts=1" target="_blank" rel="noopener" aria-label="Keyboard shortcuts"><span data-icon="shortcuts" aria-hidden="true"></span>Shortcuts</a>
      </nav>
      <header class="topbar">
        <div>
          <div class="eyebrow"><span data-icon="viewer" aria-hidden="true"></span>Viewer</div>
          <h1>Markdown &amp; Mermaid</h1>
        </div>
        <div class="toolbar-group" role="group" aria-label="Document controls">
          <label class="mode-label" for="mode">Format</label>
          <select id="mode">
            <option value="mermaid" selected>Mermaid</option>
            <option value="markdown">Markdown</option>
          </select>
          <div class="diagram-controls" id="diagram-controls">
            <label class="mode-label" for="diagram-type">Diagram type</label>
            <select id="diagram-type"></select>
          </div>
          <button type="button" class="preview-size preview-fit" id="export-html" disabled>Download HTML</button>
          <button type="button" class="preview-size preview-fit" id="print-preview" disabled>Print preview</button>
          <label class="file-control">
            <span data-icon="file" aria-hidden="true"></span>Open file
            <input id="file" type="file" accept=".md,.markdown,.mmd,.mermaid,.txt,text/plain">
          </label>
        </div>
      </header>
      <p id="document-export-status" role="status" hidden></p>
      <p id="file-error" role="alert" hidden></p>
      <div class="workspace" id="viewer-workspace">
        <section class="pane editor" id="source-pane" aria-label="Editor">
          <div class="pane-header">
            <span data-icon="source" aria-hidden="true"></span><label for="source">Source</label>
          </div>
          <textarea id="source" maxlength="100000" spellcheck="false" placeholder="Paste Markdown or Mermaid source"></textarea>
        </section>
        <section class="pane" aria-labelledby="preview-heading">
          <div class="pane-header">
            <span data-icon="preview" aria-hidden="true"></span><h2 id="preview-heading">Preview</h2>
            <div class="preview-tools" role="group" aria-label="Preview navigation">
              <button class="preview-size" type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out">
                <span data-icon="zoomOut" aria-hidden="true"></span>
              </button>
              <output id="preview-zoom" aria-label="Preview zoom">100%</output>
              <button class="preview-size" type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in">
                <span data-icon="zoomIn" aria-hidden="true"></span>
              </button>
              <button class="preview-size preview-fit" type="button" id="preview-fit" title="Fit preview">Fit</button>
              <button class="preview-size" type="button" id="preview-pan" aria-label="Pan preview" title="Pan preview" aria-pressed="false">
                <span data-icon="hand" aria-hidden="true"></span>
              </button>
            </div>
            <div id="standalone-export"></div>
            <button id="preview-size" class="preview-size" type="button" aria-label="Expand preview" title="Expand preview" aria-controls="viewer-workspace">
              <span data-icon="expand" aria-hidden="true"></span>
            </button>
          </div>
          <div id="preview-viewport" class="preview-viewport" tabindex="0" role="region" aria-label="Preview canvas">
            <div id="preview" class="preview"></div>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
