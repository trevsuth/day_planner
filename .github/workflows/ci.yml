name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    # The locked Playwright browser supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: daily_planner
          POSTGRES_USER: daily_planner
          POSTGRES_PASSWORD: daily_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U daily_planner -d daily_planner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://daily_planner:daily_planner@127.0.0.1:5432/daily_planner
      TEST_DATABASE_URL: postgresql://daily_planner:daily_planner@127.0.0.1:5432/daily_planner

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.8'

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            obsidian-arrow/package-lock.json
            viewer/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build hosted Graph frontend
        run: |
          npm --prefix obsidian-arrow ci
          npm --prefix obsidian-arrow run build:hosted

      - name: Build Markdown and Mermaid viewer
        run: |
          npm --prefix viewer ci
          npm --prefix viewer run build

      - name: Install Playwright browser
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Lint Python
        run: uv run --locked ruff check app_planner app_projmgmt app_graph app_viewer app_validation deploy/k3s tests

      - name: Run Python tests
        run: |
          uv run --locked --no-build coverage run -m pytest
          uv run --locked --no-build coverage combine
          uv run --locked --no-build coverage xml

      - name: Build frontend
        run: npm --prefix web run build

      - name: Typecheck frontend
        run: npm --prefix web run typecheck

      - name: Run frontend and Graph unit tests
        run: |
          node --experimental-strip-types --experimental-test-coverage \
            --test-reporter=spec --test-reporter=lcov \
            --test-reporter-destination=stdout --test-reporter-destination=web-lcov.info \
            --test web/src/domain/*.test.js web/src/domain/*.test.ts obsidian-arrow/src/lib/*.test.js

      - name: Run browser smoke tests
        env:
          PLAYWRIGHT_COVERAGE: "1"
        run: npm --prefix web run test:e2e

      - name: Analyze with SonarQube Cloud
        if: >-
          vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' &&
          (github.ref == 'refs/heads/main' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.actor != 'dependabot[bot]'))
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_REGION: ${{ vars.SONAR_REGION }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  trivy:
    name: Trivy (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image
        env:
          TARGET: ${{ matrix.target }}
        run: docker build --target "$TARGET" --tag "day-planner:$TARGET" .
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: day-planner:${{ matrix.target }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.34.1
      - name: Install manifest validators
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64 -o "$RUNNER_TEMP/bin/yq"
          chmod +x "$RUNNER_TEMP/bin/yq"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz |
            tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Validate HTTP and TLS overlays
        run: |
          cp -R deploy "$RUNNER_TEMP/deploy"
          overlay="$RUNNER_TEMP/deploy/k3s-overlays/example"
          manifest="$RUNNER_TEMP/manifest.yaml"

          kubectl kustomize "$overlay" > "$manifest"
          if bash deploy/k3s/check-rendered.sh "$manifest"; then
            printf '%s\n' 'The example template must fail deployment checks before configuration.' >&2
            exit 1
          fi

          sed -i 's|registry.example.com|ghcr.io/day-planner-ci|g; s|YOUR_RELEASE_TAG|v0.0.0|g; s|planner.example.com|planner.home.test|g' \
            "$overlay/kustomization.yaml" "$overlay/ingress-https.yaml"
          kubectl kustomize "$overlay" > "$manifest"
          bash deploy/k3s/check-rendered.sh "$manifest"
          kubeconform -strict -summary -kubernetes-version 1.34.0 "$manifest"

          sed -i 's|# - path: ingress-https.yaml|- path: ingress-https.yaml|' "$overlay/kustomization.yaml"
          export SAMPLE_DIGEST="sha256:$(printf '%064d' 0)"
          yq -i '.images[] |= (del(.newTag) | .digest = strenv(SAMPLE_DIGEST))' "$overlay/kustomization.yaml"
          kubectl kustomize "$overlay" > "$manifest"
          bash deploy/k3s/check-rendered.sh "$manifest"
          kubeconform -strict -summary -kubernetes-version 1.34.0 "$manifest"
