name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    # The locked Playwright browser supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: daily_planner
          POSTGRES_USER: daily_planner
          POSTGRES_PASSWORD: daily_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U daily_planner -d daily_planner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://daily_planner:daily_planner@127.0.0.1:5432/daily_planner
      TEST_DATABASE_URL: postgresql://daily_planner:daily_planner@127.0.0.1:5432/daily_planner

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.8'

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            obsidian-arrow/package-lock.json
            viewer/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build hosted Graph frontend
        run: |
          npm --prefix obsidian-arrow ci
          npm --prefix obsidian-arrow run build:hosted

      - name: Build Markdown and Mermaid viewer
        run: |
          npm --prefix viewer ci
          npm --prefix viewer run build

      - name: Install Playwright browser
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Lint Python
        run: uv run --locked ruff check app_planner app_projmgmt app_graph deploy/k3s tests

      - name: Run Python tests
        run: uv run --locked pytest

      - name: Build frontend
        run: npm --prefix web run build

      - name: Typecheck frontend
        run: npm --prefix web run typecheck

      - name: Run frontend unit tests
        run: npm --prefix web run test:unit

      - name: Run browser smoke tests
        run: npm --prefix web run test:e2e

  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.34.1
      - name: Install manifest validators
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64 -o "$RUNNER_TEMP/bin/yq"
          chmod +x "$RUNNER_TEMP/bin/yq"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz |
            tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Validate HTTP and TLS overlays
        run: |
          cp -R deploy "$RUNNER_TEMP/deploy"
          overlay="$RUNNER_TEMP/deploy/k3s-overlays/example"
          manifest="$RUNNER_TEMP/manifest.yaml"

          kubectl kustomize "$overlay" > "$manifest"
          if bash deploy/k3s/check-rendered.sh "$manifest"; then
            printf '%s\n' 'The example template must fail deployment checks before configuration.' >&2
            exit 1
          fi

          sed -i 's|registry.example.com|ghcr.io/day-planner-ci|g; s|YOUR_RELEASE_TAG|v0.0.0|g; s|planner.example.com|planner.home.test|g' \
            "$overlay/kustomization.yaml" "$overlay/ingress-https.yaml"
          kubectl kustomize "$overlay" > "$manifest"
          bash deploy/k3s/check-rendered.sh "$manifest"
          kubeconform -strict -summary -kubernetes-version 1.34.0 "$manifest"

          sed -i 's|# - path: ingress-https.yaml|- path: ingress-https.yaml|' "$overlay/kustomization.yaml"
          export SAMPLE_DIGEST="sha256:$(printf '%064d' 0)"
          yq -i '.images[] |= (del(.newTag) | .digest = strenv(SAMPLE_DIGEST))' "$overlay/kustomization.yaml"
          kubectl kustomize "$overlay" > "$manifest"
          bash deploy/k3s/check-rendered.sh "$manifest"
          kubeconform -strict -summary -kubernetes-version 1.34.0 "$manifest"
