name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    # The locked Playwright browser supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: daily_planner
          POSTGRES_USER: daily_planner
          POSTGRES_PASSWORD: daily_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daily_planner -d daily_planner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://daily_planner:daily_planner@127.0.0.1:5432/daily_planner
      TEST_DATABASE_URL: postgresql://daily_planner:daily_planner@127.0.0.1:5432/daily_planner

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            obsidian-arrow/package-lock.json
            viewer/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build hosted Graph frontend
        run: |
          npm --prefix obsidian-arrow ci
          npm --prefix obsidian-arrow run build:hosted

      - name: Build Markdown and Mermaid viewer
        run: |
          npm --prefix viewer ci
          npm --prefix viewer run build

      - name: Install Playwright browser
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: Lint Python
        run: uv run ruff check app_planner app_projmgmt app_graph deploy/k3s/package-release.py tests

      - name: Run Python tests
        run: uv run pytest

      - name: Build frontend
        run: npm --prefix web run build

      - name: Typecheck frontend
        run: npm --prefix web run typecheck

      - name: Run frontend unit tests
        run: npm --prefix web run test:unit

      - name: Run browser smoke tests
        run: npm --prefix web run test:e2e

  deployment-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.34.1
      - name: Render and verify a sample release archive
        run: |
          digest="sha256:$(printf '%064d' 0)"
          python3 deploy/k3s/package-release.py v0.0.0 "$RUNNER_TEMP" \
            "ghcr.io/example/web@$digest" "ghcr.io/example/api@$digest" "ghcr.io/example/viewer@$digest"
          cd "$RUNNER_TEMP"
          sha256sum -c day-planner-k3s-v0.0.0.tar.gz.sha256
