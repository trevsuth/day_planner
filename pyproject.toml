[project]
name = "daily-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.111.0",
    "psycopg[binary]>=3.2.9",
    "pydantic>=2.11.3",
    "uvicorn>=0.29.0",
]

[dependency-groups]
desktop = [
    "pyinstaller>=6.13.0",
    "textual>=3.1.0",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "ruff>=0.11.5",
]

[tool.uv]
default-groups = ["dev", "desktop"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "."
]
