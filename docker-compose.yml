x-api: &api
  image: daily-planner-api:local
  environment:
    DATABASE_URL: postgresql://daily_planner:daily_planner@postgres:5432/daily_planner

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: daily_planner
      POSTGRES_USER: daily_planner
      POSTGRES_PASSWORD: daily_planner
    volumes:
      - daily_planner_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U daily_planner -d daily_planner"]
      interval: 10s
      timeout: 5s
      retries: 5

  daily-planner:
    build:
      context: .
      target: web
    image: daily-planner-web:local
    restart: unless-stopped
    depends_on:
      daily-planner-api:
        condition: service_healthy
    environment:
      API_UPSTREAM: daily-planner-api:8000
    ports:
      - "${DAILY_PLANNER_PORT:-8080}:8080"

  migrate:
    <<: *api
    pull_policy: never
    command: ["python", "-m", "app_planner.migrate"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  daily-planner-api:
    <<: *api
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  obsidian-arrow:
    profiles: [legacy-graph]
    build:
      context: ./obsidian-arrow
    image: arrowsapp:local
    ports:
      - "${ARROWSAPP_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  daily_planner_postgres_data:
