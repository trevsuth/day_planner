services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: daily_planner
      POSTGRES_USER: daily_planner
      POSTGRES_PASSWORD: daily_planner
    volumes:
      - daily_planner_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daily_planner -d daily_planner"]
      interval: 10s
      timeout: 5s
      retries: 5

  daily-planner:
    build:
      context: .
      target: web
    image: daily-planner-web:local
    restart: unless-stopped
    depends_on:
      daily-planner-api:
        condition: service_healthy
    ports:
      - "${DAILY_PLANNER_PORT:-8080}:8080"

  daily-planner-api:
    build:
      context: .
      target: api
    image: daily-planner-api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://daily_planner:daily_planner@postgres:5432/daily_planner
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  markdown-viewer:
    build:
      context: .
      target: viewer
    image: markdown-viewer:local
    restart: unless-stopped

  obsidian-arrow:
    profiles: [legacy-graph]
    build:
      context: ./obsidian-arrow
    image: arrowsapp:local
    ports:
      - "${ARROWSAPP_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  daily_planner_postgres_data:
