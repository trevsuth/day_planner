apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daily-planner
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: planner.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: daily-planner
                port:
                  number: 80
