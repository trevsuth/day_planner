apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  labels:
    app.kubernetes.io/name: postgres-backups
    app.kubernetes.io/part-of: daily-planner
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: daily-planner
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: daily-planner
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:17-alpine
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: daily-planner-db
              command:
                - sh
                - -c
                - |
                  set -eu
                  umask 077
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  partial=$(mktemp "/backups/.daily-planner-${timestamp}.XXXXXX")
                  trap 'rm -f "$partial"' EXIT
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  pg_dump \
                    --host=postgres \
                    --username="$POSTGRES_USER" \
                    --dbname="$POSTGRES_DB" \
                    --format=custom \
                    --file="$partial"
                  mv "$partial" "/backups/daily-planner-${timestamp}.dump"
                  find /backups -name 'daily-planner-*.dump' -mtime +14 -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
