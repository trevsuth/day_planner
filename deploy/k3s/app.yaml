apiVersion: v1
kind: Service
metadata:
  name: daily-planner
  labels:
    app.kubernetes.io/name: daily-planner
    app.kubernetes.io/part-of: daily-planner
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: daily-planner
    app.kubernetes.io/part-of: daily-planner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daily-planner
  labels:
    app.kubernetes.io/name: daily-planner
    app.kubernetes.io/part-of: daily-planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: daily-planner
      app.kubernetes.io/part-of: daily-planner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daily-planner
        app.kubernetes.io/part-of: daily-planner
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: daily-planner
          image: daily-planner-web
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /graph/
              port: http
          livenessProbe:
            httpGet:
              path: /graph/
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: runtime
              mountPath: /tmp
      volumes:
        - name: runtime
          emptyDir: {}
