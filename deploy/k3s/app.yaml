apiVersion: v1
kind: Service
metadata:
  name: daily-planner
  labels:
    app.kubernetes.io/name: daily-planner
    app.kubernetes.io/part-of: daily-planner
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: daily-planner
    app.kubernetes.io/part-of: daily-planner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daily-planner
  labels:
    app.kubernetes.io/name: daily-planner
    app.kubernetes.io/part-of: daily-planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: daily-planner
      app.kubernetes.io/part-of: daily-planner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daily-planner
        app.kubernetes.io/part-of: daily-planner
      annotations:
        prometheus.io/scrape: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: daily-planner
          image: daily-planner
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: daily-planner-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /graph/
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
