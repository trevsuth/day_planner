server {
    listen 8080;
    absolute_redirect off;
    root /usr/share/nginx/html;
    resolver $DNS_RESOLVER valid=5s ipv6=off;
    client_max_body_size 24m;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $correlation_id;
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $correlation_id always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(api(?:/|$)|docs(?:/|$)|redoc$|openapi\.json$) {
        set $api $API_UPSTREAM;
        proxy_pass http://$api;
    }

    location = /viewer { return 308 /viewer/; }

    location /viewer/ {
        try_files $uri $uri/ =404;
    }
}
