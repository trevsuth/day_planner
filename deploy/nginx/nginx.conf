pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $http_x_request_id $correlation_id {
        default $request_id;
        "~^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$" $http_x_request_id;
    }
    map $uri $route_group {
        default web;
        ~^/api(?:/|$) api;
        ~^/graph(?:/|$) graph;
        ~^/viewer(?:/|$) viewer;
    }
    log_format suite_json escape=json
        '{"timestamp":"$time_iso8601","event":"gateway_request","request_id":"$correlation_id",'
        '"method":"$request_method","route_group":"$route_group","status":$status,'
        '"duration_seconds":$request_time,"upstream_status":"$upstream_status","upstream_seconds":"$upstream_response_time"}';
    access_log /dev/stdout suite_json;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    include /tmp/routes.conf;
}
